<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DugoutIQ — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
  :root{
    --navy:#0E1A3A; --navy-deep:#0A1430; --card:#16244F; --line:rgba(169,197,232,.22);
    --powder:#A9C5E8; --white:#fff; --gold:#F5C518; --live:#E5484D;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--navy); color:var(--white);
    font-family:'Saira Condensed',system-ui,-apple-system,sans-serif;
    padding-bottom:env(safe-area-inset-bottom); }
  a{ color:inherit; text-decoration:none; }

  .top{ position:sticky; top:0; z-index:10; background:var(--navy-deep);
    border-bottom:1px solid var(--line); padding:14px 16px; }
  .top h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:.02em; }
  .top .sub{ color:var(--powder); font-size:11.5px; letter-spacing:.14em;
    text-transform:uppercase; margin-top:3px; display:flex; align-items:center; gap:7px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--live); flex:none;
    animation:p 1.6s infinite; }
  .dot.stale{ background:var(--powder); animation:none; }
  @keyframes p{ 0%,100%{opacity:1} 50%{opacity:.3} }

  .sec{ padding:16px 16px 6px; color:var(--powder); font-size:11.5px;
    letter-spacing:.18em; text-transform:uppercase; }

  .g{ display:flex; align-items:stretch; gap:12px; margin:0 12px 10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; }
  .g:active{ border-color:var(--gold); }
  .g.manual{ cursor:default; opacity:.92; }
  .teams{ flex:1; min-width:0; }
  .row{ display:flex; align-items:center; gap:10px; padding:2px 0; min-height:36px; }
  .chip{ width:9px; height:22px; border-radius:3px; flex:none; background:#22345f; }
  .nm{ flex:1; min-width:0; font-size:16px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.lose .nm,.row.lose .sc{ color:var(--powder); font-weight:600; }
  .sc{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .win{ width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-right:6px solid var(--gold); flex:none; }
  .state{ width:76px; flex:none; border-left:1px solid var(--line); padding-left:12px;
    display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .state .s{ font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
  .state .s.final{ color:var(--powder); }
  .state .s.live{ color:var(--live); }
  .state .meta{ font-size:11px; color:var(--powder); }

  .msg{ margin:32px 20px; padding:18px; border:1px dashed var(--line); border-radius:14px;
    color:var(--powder); font-size:14px; line-height:1.55; text-align:center; }
  .foot{ margin:22px 16px 30px; color:var(--powder); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; text-align:center; opacity:.75; }
  .s.next{ color:var(--gold,#F5C518); }
  .tabs{ display:flex; gap:20px; margin-top:11px; }
  .tabs button{ background:none; border:0; padding:0 0 9px; cursor:pointer;
    font-family:inherit; font-size:14.5px; font-weight:700; color:var(--muted);
    border-bottom:3px solid transparent; }
  .tabs button.on{ color:#fff; border-bottom-color:var(--gold,#F5C518); }
  table.stand{ width:100%; border-collapse:collapse; margin:2px 0 14px; }
  table.stand th, table.stand td{ padding:9px 12px; font-size:14px; text-align:right;
    font-variant-numeric:tabular-nums; }
  table.stand th{ font-size:11px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid var(--line); }
  table.stand td.l, table.stand th.l{ text-align:left; }
  table.stand tbody tr:nth-child(odd){ background:rgba(255,255,255,.03); }
  .meta.stage{ color:var(--gold,#F5C518); font-weight:700; }
  /* the colour chip is a 9px bar; a crest needs to be square and much larger,
     so it overrides both dimensions rather than inheriting the bar shape */
  .chip.logo{ width:34px; height:34px; border-radius:50%; object-fit:contain;
    background:rgba(255,255,255,.08); padding:2px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand img{ width:42px; height:42px; object-fit:contain; flex:none; }
  .brand h1{ margin:0; }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><img id="evlogo" alt="" hidden><h1 id="title">Games</h1></div>
  <div class="sub"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
  <div class="tabs" id="tabs">
    <button data-v="sched" class="on">Schedule</button>
    <button data-v="stand">Standings</button>
  </div>
</div>

<div id="content"><div class="msg">Loading games…</div></div>
<div class="foot">DugoutIQ &middot; Manage the Game</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const ORD = (n) => { const v = n % 100; if (v >= 11 && v <= 13) return n + "th";
    return n + (["th","st","nd","rd"][n % 10] || "th"); };

  // Optional ?e=NAME filters the board to one event by title text only —
  // the public index carries team names and scores, never player names.
  const params = new URLSearchParams(location.search);
  // accept ?event=, ?ev= or the older ?e=
  const evName = (params.get("event") || params.get("ev") || params.get("e") || "").trim();
  if (evName) $("title").textContent = evName;

  let lastUpdated = 0;

  function card(g){
    const live = !g.over;
    const aWin = g.over && g.sA > g.sH, hWin = g.over && g.sH > g.sA;
    const half = g.half === "bottom" ? "Bot" : "Top";
    const team = (name, color, runs, winner, loser, logo) => `
      <div class="row ${loser ? "lose" : ""}">
        ${logo
          ? `<img class="chip logo" src="${esc(logo)}" alt="">`
          : `<div class="chip" ${color ? `style="background:${esc(color)}"` : ""}></div>`}
        <div class="nm">${esc(name)}</div>
        <div class="sc">${Number(runs) || 0}</div>
        ${winner ? '<div class="win"></div>' : ""}
      </div>`;
    // manual results and unplayed fixtures open nothing
    const inert = g.manual || g.sched;
    const tag = inert ? "div" : "a";
    const href = inert ? "" : ` href="spectate.html?g=${encodeURIComponent(g.code)}"`;
    return `
      <${tag} class="g${inert ? " manual" : ""}"${href}>
        <div class="teams">
          ${team(g.away, g.ac, g.sched ? "\u2014" : g.sA, aWin, g.over && !aWin, g.al)}
          ${team(g.home, g.hc, g.sched ? "\u2014" : g.sH, hWin, g.over && !hWin, g.hl)}
        </div>
        <div class="state">
          ${g.sched
            ? `<div class="s next">${esc(timeLabel(g.gtime) || "Upcoming")}</div>`
            : live
              ? `<div class="s live">Live</div><div class="meta">${half} ${ORD(g.inning || 1)}</div>`
              : `<div class="s final">Final</div>${g.manual ? "" : `<div class="meta">${(g.linescore || []).length} inn</div>`}`}
          ${g.gnum ? `<div class="meta">Game ${esc(g.gnum)}</div>` : ""}
          ${g.stage ? `<div class="meta stage">${esc(g.stage)}</div>` : ""}
          ${g.manual ? `<div class="meta">score only</div>` : ""}
          ${[timeLabel(g.gtime), g.gfield].filter(Boolean).length
            ? `<div class="meta">${esc([timeLabel(g.gtime), g.gfield].filter(Boolean).join(" \u00b7 "))}</div>` : ""}
        </div>
      </${tag}>`;
  }

  function dayLabel(d){
    if (!d) return "Other games";
    const t = Date.parse(d + "T00:00:00");
    if (isNaN(t)) return "Other games";
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((t - today.getTime()) / 86400000);
    const s = new Date(t).toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
    if (diff === 0) return "Today \u00b7 " + s;
    if (diff === -1) return "Yesterday \u00b7 " + s;
    return s;
  }
  function timeLabel(t){
    if (!t) return "";
    const p = String(t).split(":"); if (p.length < 2) return t;
    let h = parseInt(p[0], 10); const m = p[1];
    const ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (!h) h = 12;
    return h + ":" + m + " " + ap;
  }
  let view = "sched";
  function standings(list){
    // only completed games count; a game in progress has no result yet
    // Playoff games don't move the round-robin table, so they're excluded.
    const done = list.filter((g) => g.over && !g.sched && !String(g.stage || "").trim());
    const T = {};
    const get = (name, pool) => {
      const k = String(name || "").toLowerCase();
      if (!T[k]) T[k] = { name: name || "?", pool: (pool || "").toUpperCase(), w: 0, l: 0, t: 0, rf: 0, ra: 0 };
      else if (!T[k].pool && pool) T[k].pool = String(pool).toUpperCase();
      return T[k];
    };
    done.forEach((g) => {
      const a = get(g.away, g.apool), h = get(g.home, g.hpool);
      const sA = Number(g.sA || 0), sH = Number(g.sH || 0);
      a.rf += sA; a.ra += sH; h.rf += sH; h.ra += sA;
      if (sA > sH) { a.w++; h.l++; }
      else if (sH > sA) { h.w++; a.l++; }
      else { a.t++; h.t++; }
    });
    const rows = Object.keys(T).map((k) => T[k]);
    const pools = {};
    rows.forEach((r) => { const p = r.pool || ""; (pools[p] = pools[p] || []).push(r); });
    Object.keys(pools).forEach((p) => pools[p].sort((x, y) => {
      const px = x.w + x.l + x.t ? x.w / (x.w + x.l + x.t) : 0;
      const py = y.w + y.l + y.t ? y.w / (y.w + y.l + y.t) : 0;
      if (px !== py) return py - px;
      return (y.rf - y.ra) - (x.rf - x.ra);   // then run differential
    }));
    return pools;
  }
  function renderStandings(list){
    const pools = standings(list);
    const keys = Object.keys(pools).sort();
    if (!keys.length || !keys.some((k) => pools[k].length)){
      $("content").innerHTML = '<div class="msg">No completed games yet.</div>';
      return;
    }
    let html = "";
    keys.forEach((p) => {
      if (keys.length > 1 || p) html += `<div class="sec">${p ? "Pool " + esc(p) : "Standings"}</div>`;
      html += '<table class="stand"><thead><tr><th class="l">Team</th><th>W</th><th>L</th><th>RF</th><th>RA</th><th>DIFF</th></tr></thead><tbody>';
      pools[p].forEach((r) => {
        const d = r.rf - r.ra;
        html += `<tr><td class="l">${esc(r.name)}</td><td>${r.w}</td><td>${r.l}${r.t ? "-" + r.t : ""}</td>`
          + `<td>${r.rf}</td><td>${r.ra}</td><td>${d > 0 ? "+" + d : d}</td></tr>`;
      });
      html += "</tbody></table>";
    });
    html += '<div class="msg" style="padding:14px 20px;font-size:11.5px">Round robin only \u2014 playoff games are excluded. Sorted by win percentage, then run differential. '
      + 'Your tournament&rsquo;s own tiebreakers may differ.</div>';
    $("content").innerHTML = html;
  }
  function render(games){
    // ?event=NAME pins the hub to one tournament; matches the event the scorer
    // tagged the game with, not the team names
    const list = evName
      ? games.filter((g) => String(g.ev || "").toLowerCase().includes(evName.toLowerCase()))
      : games;
    if (!list.length){
      $("content").innerHTML = '<div class="msg">No games are being shared right now.<br>' +
        'They appear here while a scorer has the live link switched on.</div>';
      return;
    }
    // group by the day the game was played, newest first; live games lead each day
    const byDay = {};
    list.forEach((g) => { const k = g.gdate || ""; (byDay[k] = byDay[k] || []).push(g); });
    // A tournament reads forwards (Friday first). A general hub of recent games
    // reads backwards, newest first.
    const days = Object.keys(byDay).sort((a, b) => (evName
        ? (a < b ? -1 : a > b ? 1 : 0)
        : (a < b ? 1 : a > b ? -1 : 0)));
    let html = "";
    days.forEach((d) => {
      html += `<div class="sec">${esc(dayLabel(d))}</div>`;
      byDay[d].sort((a, b) => {
        const rank = (x) => (x.sched ? 2 : x.over ? 1 : 0); // live, final, then upcoming
        if (rank(a) !== rank(b)) return rank(a) - rank(b);
        const na = parseInt(a.gnum, 10), nb = parseInt(b.gnum, 10);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
        return String(a.gtime || "").localeCompare(String(b.gtime || ""));
      }).forEach((g) => { html += card(g); });
    });
    $("content").innerHTML = html;
  }
  function drawTabs(){
    const bar = document.getElementById("tabs");
    if (!bar) return;
    Array.prototype.forEach.call(bar.children, (b) => {
      b.classList.toggle("on", b.getAttribute("data-v") === view);
      b.onclick = () => { view = b.getAttribute("data-v"); if (lastGames) route(lastGames); };
    });
  }
  let lastGames = null;
  function route(games){
    lastGames = games;
    const list = evName
      ? games.filter((g) => String(g.ev || "").toLowerCase().includes(evName.toLowerCase()))
      : games;
    drawTabs();
    if (view === "stand") renderStandings(list);
    else render(games);
  }

  async function poll(){
    try{
      const r = await fetch("/.netlify/functions/game?list=1", { cache:"no-store" });
      const d = await r.json();
      if (d && d.ok && Array.isArray(d.games)){
        lastUpdated = Date.now();
        route(d.games);
        const shown = evName
          ? d.games.filter((g) => String(g.ev || "").toLowerCase().includes(evName.toLowerCase()))
          : d.games;
        const liveN = shown.filter((g) => !g.over).length;
        $("status").textContent = `${shown.length} game${shown.length===1?"":"s"}`
          + (liveN ? ` \u00b7 ${liveN} live` : "") + " \u00b7 updating";
        // prefer the display title the scorer set; fall back to the URL name with
        // runTogetherWords split back out so "12UGirlsTier2" reads properly
        const brand = shown.find((g) => g.evtitle || g.evlogo) || {};
        const pretty = (s) => String(s || "")
          .replace(/([a-z])([A-Z])/g, "$1 $2")        // GirlsTier -> Girls Tier
          .replace(/([A-Za-z])([0-9])/g, "$1 $2")     // Tier2 -> Tier 2
          .replace(/([0-9]+[Uu])([A-Z])/g, "$1 $2")   // 12UGirls -> 12U Girls
          .replace(/\s+/g, " ")
          .trim();
        const t = document.getElementById("title");
        if (t) t.textContent = brand.evtitle || (evName ? pretty(evName) : "Games");
        const el = document.getElementById("evlogo");
        if (el) {
          if (brand.evlogo) { el.src = brand.evlogo; el.hidden = false; }
          else el.hidden = true;
        }
        $("dot").classList.remove("stale");
      }
    }catch(e){ /* keep the last view */ }
    if (lastUpdated && Date.now() - lastUpdated > 30000){
      $("dot").classList.add("stale");
      $("status").textContent = "Paused — reopen to refresh";
    }
  }

  poll();
  setInterval(poll, 8000);
</script>
</body>
</html>
